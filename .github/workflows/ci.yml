name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" --
      - name: Check push whitespace
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" --
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install pinned CLI for credential-free API metadata checks
        run: |
          python3 tools/fetch-aliyun.py
          printf '%s/.cache/tools\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - run: make deps build test lint
      - run: go test -race ./...
      - run: go test -race -tags=responsegate ./internal/acceptance ./internal/aliyun ./internal/provider
      - run: go build -tags=responsegate -o bin/fleeting-plugin-aliyun-responsegate ./cmd/fleeting-plugin-aliyun
      - run: go build -tags live -o bin/aliyun-acceptance ./cmd/aliyun-acceptance
      - run: make test-live-extended
        env:
          RUN_LIVE_ACCEPTANCE: ''
      - run: python3 tools/fetch-runner.py
      - run: python3 tools/check-configs.py --runner .cache/gitlab-runner-linux-amd64
      - run: make dist
      - name: Verify unpublished cloud candidate without credentials
        run: |
          mkdir -p .cache/candidate/responsegate
          cp -a dist .cache/candidate/dist
          GOFLAGS=-tags=responsegate make build
          cp bin/fleeting-plugin-aliyun .cache/candidate/responsegate/plugin
          candidate_sha=$(git rev-parse HEAD)
          digest=$(python3 tools/release_candidate.py create --root .cache/candidate --sha "$candidate_sha" --version 0.1.0-dev)
          python3 tools/release_candidate.py verify --root .cache/candidate --sha "$candidate_sha" --version 0.1.0-dev --digest "$digest"
      - name: Verify native assets
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          dist/packages/linux/amd64/plugin version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/dependencies.json
          retention-days: 7
