name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  security:
    uses: ./.github/workflows/security.yml
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" --
      - name: Check push whitespace
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" --
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Run quick credential-free code checks
        run: make verify-fast
  offline:
    if: always()
    needs: [build, security]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
    steps:
      - name: Require quick code and security checks
        run: test "$BUILD_RESULT" = success && test "$SECURITY_RESULT" = success
