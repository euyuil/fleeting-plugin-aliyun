name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: true
      - run: go mod download all
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check formatting and whitespace
        run: |
          test -z "$(gofmt -l internal)"
          git diff --check
