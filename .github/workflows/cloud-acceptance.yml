name: Cloud acceptance
on:
  workflow_call:
    secrets:
      RELEASE_ALIYUN_ACCOUNT_ID:
        required: false
      RELEASE_ALIYUN_ROLE_ARN:
        required: false
      RELEASE_ALIYUN_CLEANUP_ROLE_ARN:
        required: false
      RELEASE_ALIYUN_OIDC_PROVIDER_ARN:
        required: false
      RELEASE_ALIYUN_FIXTURE_CONFIG:
        required: false
      RELEASE_ALIYUN_CLEANUP_REGIONS:
        required: false
      RELEASE_ALIYUN_JOB_FIXTURE_CONFIG:
        required: false
      RELEASE_GITLAB_CONFIG:
        required: false
      RELEASE_GITLAB_API_TOKEN:
        required: false
      RELEASE_GITLAB_RUNNER_TOKEN:
        required: false
      RELEASE_GITLAB_DOCKER_RUNNER_TOKEN:
        required: false
    inputs:
      version:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      manifest_sha256:
        value: ${{ jobs.build.outputs.manifest_sha256 }}
      candidate_sha:
        value: ${{ jobs.build.outputs.candidate_sha }}
      release_ready:
        value: ${{ jobs.gate.outputs.release_ready }}
  workflow_dispatch:
    inputs:
      version:
        description: Unpublished candidate version
        required: true
        default: 0.1.0-rc.4
        type: string
      candidate_sha:
        description: Full main commit SHA (empty selects the dispatch commit)
        type: string
      mode:
        description: One scenario or the complete pre-release gate
        type: choice
        default: all
        options: [all, jobs, cloud-smoke, cloud-scale, cloud-restart, cloud-create-restart, cloud-remove-restart, cloud-increase-response-loss]
      job_cases:
        description: "Jobs debug only: all, or comma-separated executor/scenario pairs"
        type: string
        default: all
permissions:
  contents: read
concurrency:
  group: aliyun-pre-release-acceptance
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      source_ref: ${{ inputs.candidate_sha || github.sha }}
  build:
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.candidate.outputs.digest }}
      candidate_sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.source.outputs.matrix }}
      mode: ${{ steps.source.outputs.mode }}
      job_cases: ${{ steps.source.outputs.job_cases }}
      profile: ${{ steps.source.outputs.profile }}
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      MODE: ${{ inputs.mode || 'all' }}
      JOB_CASES: ${{ inputs.job_cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin a trusted main candidate
        id: source
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, 'tools')
          from release_candidate import MODES, revision
          from job_acceptance import workflow_cases
          sha = revision(os.environ['CANDIDATE_SHA'])
          mode = os.environ['MODE']
          if mode not in ('all', 'jobs', *MODES):
              raise SystemExit('unknown cloud acceptance mode')
          cases = workflow_cases(os.environ['JOB_CASES'], mode)
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          subprocess.run(['git', 'checkout', '--detach', sha], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\nmode=' + mode + '\n')
              output.write('job_cases=' + cases + '\n')
              output.write('profile=' + ('debug' if mode == 'jobs' else 'full') + '\n')
              output.write('matrix=' + json.dumps({'mode': list(MODES) if mode == 'all' else [MODES[0] if mode == 'jobs' else mode]}) + '\n')
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate and build the unpublished distribution
        env:
          VALIDATION_PROFILE: ${{ steps.source.outputs.profile }}
        run: |
          go run ./tools/distribution -validate-version "$VERSION"
          if [ "$VALIDATION_PROFILE" = full ]; then
            python3 tools/fetch-aliyun.py
            export PATH="$GITHUB_WORKSPACE/.cache/tools:$PATH"
            make verify-code dist VERSION="$VERSION"
          else
            test "$VALIDATION_PROFILE" = debug
            make verify-fast dist VERSION="$VERSION"
          fi
          mkdir -p .cache/candidate/responsegate
          cp -a dist .cache/candidate/dist
          GOFLAGS=-tags=responsegate make build VERSION="$VERSION"
          cp bin/fleeting-plugin-aliyun .cache/candidate/responsegate/plugin
      - name: Seal the exact distribution
        id: candidate
        run: |
          digest=$(python3 tools/release_candidate.py create --root .cache/candidate --sha "$CANDIDATE_SHA" --version "$VERSION")
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          tar -cf .cache/candidate.tar -C .cache/candidate .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: cloud-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/candidate.tar
          if-no-files-found: error
          retention-days: 7
  platforms:
    needs: build
    if: needs.build.outputs.profile == 'full'
    uses: ./.github/workflows/verify-candidate.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      manifest_sha256: ${{ needs.build.outputs.manifest_sha256 }}
      candidate_sha: ${{ needs.build.outputs.candidate_sha }}
      version: ${{ inputs.version }}
  scenario:
    needs: [build, platforms]
    if: needs.build.outputs.mode != 'jobs'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: aliyun-pre-release
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
      MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      MODE: ${{ matrix.mode }}
      RELEASE_CLOUD_ACCEPTANCE_ENABLED: ${{ vars.RELEASE_CLOUD_ACCEPTANCE_ENABLED }}
      RELEASE_CLOUD_CLEANUP_ENABLED: ${{ vars.RELEASE_CLOUD_CLEANUP_ENABLED }}
      RELEASE_ALIYUN_ACCOUNT_ID: ${{ secrets.RELEASE_ALIYUN_ACCOUNT_ID || vars.RELEASE_ALIYUN_ACCOUNT_ID }}
      RELEASE_ALIYUN_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_ROLE_ARN || vars.RELEASE_ALIYUN_ROLE_ARN }}
      RELEASE_ALIYUN_CLEANUP_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_CLEANUP_ROLE_ARN || vars.RELEASE_ALIYUN_CLEANUP_ROLE_ARN }}
      RELEASE_ALIYUN_OIDC_PROVIDER_ARN: ${{ secrets.RELEASE_ALIYUN_OIDC_PROVIDER_ARN || vars.RELEASE_ALIYUN_OIDC_PROVIDER_ARN }}
      RELEASE_ALIYUN_FIXTURE_CONFIG: ${{ secrets.RELEASE_ALIYUN_FIXTURE_CONFIG || vars.RELEASE_ALIYUN_FIXTURE_CONFIG }}
      RELEASE_ALIYUN_CLEANUP_REGIONS: ${{ secrets.RELEASE_ALIYUN_CLEANUP_REGIONS || vars.RELEASE_ALIYUN_CLEANUP_REGIONS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .cache/download
          merge-multiple: true
      - name: Verify candidate and dedicated account configuration before cloud access
        run: |
          test "$RELEASE_CLOUD_ACCEPTANCE_ENABLED" = true
          test "$RELEASE_CLOUD_CLEANUP_ENABLED" = true
          mkdir -p .cache/candidate
          tar -xf .cache/download/candidate.tar -C .cache/candidate
          python3 tools/release_candidate.py verify --root .cache/candidate --sha "$CANDIDATE_SHA" --version "$VERSION" --digest "$MANIFEST_SHA256"
          python3 tools/cloud_fixture.py preflight
          python3 tools/fetch-aliyun.py
          printf '%s/.cache/tools\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Obtain fresh credentials in the dedicated account
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ env.RELEASE_ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ env.RELEASE_ALIYUN_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 3600
          role-session-name: pre-release-${{ github.run_id }}
      - name: Run the scenario and verify full fixture teardown
        run: |
          python3 tools/cloud_fixture.py run --root .cache/candidate --sha "$CANDIDATE_SHA" --version "$VERSION" --digest "$MANIFEST_SHA256" --mode "$MODE" --directory ".live/$MODE" --receipt ".cache/receipts/$MODE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloud-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
          path: .cache/receipts/*.json
          if-no-files-found: warn
          retention-days: 7
  gitlab_jobs:
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      ((needs.build.outputs.profile == 'debug' && needs.platforms.result == 'skipped') ||
       (needs.build.outputs.profile == 'full' && needs.platforms.result == 'success')) &&
      (needs.build.outputs.mode == 'jobs' || (needs.build.outputs.mode == 'all' && needs.scenario.result == 'success'))
    needs: [build, platforms, scenario]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/job-acceptance.yml
    secrets:
      RELEASE_ALIYUN_ACCOUNT_ID: ${{ secrets.RELEASE_ALIYUN_ACCOUNT_ID }}
      RELEASE_ALIYUN_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_ROLE_ARN }}
      RELEASE_ALIYUN_CLEANUP_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_CLEANUP_ROLE_ARN }}
      RELEASE_ALIYUN_OIDC_PROVIDER_ARN: ${{ secrets.RELEASE_ALIYUN_OIDC_PROVIDER_ARN }}
      RELEASE_ALIYUN_CLEANUP_REGIONS: ${{ secrets.RELEASE_ALIYUN_CLEANUP_REGIONS }}
      RELEASE_ALIYUN_JOB_FIXTURE_CONFIG: ${{ secrets.RELEASE_ALIYUN_JOB_FIXTURE_CONFIG }}
      RELEASE_GITLAB_CONFIG: ${{ secrets.RELEASE_GITLAB_CONFIG }}
      RELEASE_GITLAB_API_TOKEN: ${{ secrets.RELEASE_GITLAB_API_TOKEN }}
      RELEASE_GITLAB_RUNNER_TOKEN: ${{ secrets.RELEASE_GITLAB_RUNNER_TOKEN }}
      RELEASE_GITLAB_DOCKER_RUNNER_TOKEN: ${{ secrets.RELEASE_GITLAB_DOCKER_RUNNER_TOKEN }}
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      manifest_sha256: ${{ needs.build.outputs.manifest_sha256 }}
      candidate_sha: ${{ needs.build.outputs.candidate_sha }}
      version: ${{ inputs.version }}
      phase: candidate
      cases: ${{ needs.build.outputs.job_cases }}
      profile: ${{ needs.build.outputs.profile }}
  gate:
    if: always()
    needs: [build, platforms, scenario, gitlab_jobs]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      release_ready: ${{ steps.result.outputs.release_ready }}
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
      MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      MODE: ${{ needs.build.outputs.mode }}
      BUILD_RESULT: ${{ needs.build.result }}
      PLATFORM_RESULT: ${{ needs.platforms.result }}
      SCENARIO_RESULT: ${{ needs.scenario.result }}
      JOB_RESULT: ${{ needs.gitlab_jobs.result }}
      JOB_READY: ${{ needs.gitlab_jobs.outputs.release_ready }}
      JOB_SELECTED_READY: ${{ needs.gitlab_jobs.outputs.selected_ready }}
      JOB_CASES: ${{ needs.build.outputs.job_cases }}
      PROFILE: ${{ needs.build.outputs.profile }}
    steps:
      - name: Require completed build and selected acceptance paths
        run: |
          test "$BUILD_RESULT" = success
          if [ "$PROFILE" = debug ]; then
            test "$MODE" = jobs && test "$PLATFORM_RESULT" = skipped && test "$SCENARIO_RESULT" = skipped
          else
            test "$PROFILE" = full && test "$PLATFORM_RESULT" = success
          fi
          if [ "$MODE" != jobs ]; then test "$SCENARIO_RESULT" = success; fi
          if [ "$MODE" = all ] || [ "$MODE" = jobs ]; then
            test "$JOB_RESULT" = success && test "$JOB_SELECTED_READY" = true
            if [ "$PROFILE" = full ]; then test "$JOB_READY" = true; else test "$JOB_READY" = false; fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .cache/download
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: env.MODE != 'jobs'
        with:
          pattern: cloud-receipt-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .cache/receipts
          merge-multiple: true
      - name: Require matching successful receipts including cleanup
        id: result
        run: |
          mkdir -p .cache/candidate
          tar -xf .cache/download/candidate.tar -C .cache/candidate
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from release_candidate import check_receipt, gate, verify
          root, receipts = pathlib.Path('.cache/candidate'), pathlib.Path('.cache/receipts')
          sha, version, digest = os.environ['CANDIDATE_SHA'], os.environ['VERSION'], os.environ['MANIFEST_SHA256']
          run, attempt, mode = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], os.environ['MODE']
          if mode == 'jobs':
              verify(root, digest, sha, version)
          elif mode == 'all':
              gate(root, receipts, digest, sha, version, run, attempt)
          else:
              manifest = verify(root, digest, sha, version)
              paths = list(receipts.glob('*.json'))
              if len(paths) != 1:
                  raise SystemExit('exactly one scenario receipt is required')
              check_receipt(json.loads(paths[0].read_text()), manifest, digest, mode, run, attempt)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_ready=' + ('true' if mode == 'all' else 'false') + '\n')
          PY
