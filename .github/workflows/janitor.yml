name: Expired acceptance janitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [Live acceptance]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: aliyun-fixed-acceptance-pool
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  cleanup:
    if: >-
      vars.ENABLE_ACCEPTANCE_JANITOR == 'true' &&
      vars.ALIYUN_CLEANUP_ROLE_ARN != '' && vars.ALIYUN_OIDC_PROVIDER_ARN != '' &&
      vars.ALIYUN_REGION != '' && vars.ALIYUN_SCALING_GROUP_ID != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       github.event_name == 'schedule' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RUN_LIVE_ACCEPTANCE: '1'
      ACCEPTANCE_PROJECT: ${{ github.repository }}
      ALIYUN_REGION: ${{ vars.ALIYUN_REGION }}
      ALIYUN_SCALING_GROUP_ID: ${{ vars.ALIYUN_SCALING_GROUP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ vars.ALIYUN_CLEANUP_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 3600
          role-session-name: janitor-${{ github.run_id }}
      - name: Recover prior ledger as data
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: live-evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .live/recovered
      - run: go run -tags live ./cmd/aliyun-acceptance janitor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: janitor-evidence
          path: .live/run-*/cleanup.json
          retention-days: 7
