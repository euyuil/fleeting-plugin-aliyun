name: Release job acceptance
on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      phase:
        required: true
        type: string
      cases:
        type: string
        default: all
      profile:
        type: string
        default: full
    secrets:
      RELEASE_ALIYUN_ACCOUNT_ID:
        required: false
      RELEASE_ALIYUN_ROLE_ARN:
        required: false
      RELEASE_ALIYUN_CLEANUP_ROLE_ARN:
        required: false
      RELEASE_ALIYUN_OIDC_PROVIDER_ARN:
        required: false
      RELEASE_ALIYUN_CLEANUP_REGIONS:
        required: false
      RELEASE_ALIYUN_JOB_FIXTURE_CONFIG:
        required: false
      RELEASE_GITLAB_CONFIG:
        required: false
      RELEASE_GITLAB_API_TOKEN:
        required: false
      RELEASE_GITLAB_RUNNER_TOKEN:
        required: false
      RELEASE_GITLAB_DOCKER_RUNNER_TOKEN:
        required: false
    outputs:
      release_ready:
        value: ${{ jobs.gate.outputs.release_ready }}
      selected_ready:
        value: ${{ jobs.gate.outputs.selected_ready }}
      public_ready:
        value: ${{ jobs.gate.outputs.public_ready }}
permissions:
  contents: read
# The caller owns aliyun-pre-release-acceptance for this entire workflow.
# Acquiring that group again here would deadlock the reusable workflow.
defaults:
  run:
    shell: bash
jobs:
  selection:
    name: Select executor lanes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    env:
      JOB_CASES: ${{ inputs.cases }}
      PROFILE: ${{ inputs.profile }}
      PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Select the two executor lanes
        id: cases
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools')
          from job_acceptance import EXECUTORS, workflow_profile
          cases = workflow_profile(os.environ['PROFILE'], os.environ['PHASE'], os.environ['JOB_CASES'])
          matrix = {'include': [{'executor': executor} for executor in EXECUTORS if any(case[0] == executor for case in cases)]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PY
  scenario:
    name: ${{ matrix.executor }}
    permissions:
      contents: read
      id-token: write
    needs: selection
    if: github.ref == 'refs/heads/main'
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    uses: ./.github/workflows/job-acceptance-lane.yml
    with:
      artifact_id: ${{ inputs.artifact_id }}
      manifest_sha256: ${{ inputs.manifest_sha256 }}
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
      phase: ${{ inputs.phase }}
      profile: ${{ inputs.profile }}
      cases: ${{ inputs.cases }}
      executor: ${{ matrix.executor }}
    secrets: inherit
  gate:
    name: Verify selected job cases
    if: always()
    needs: [selection, scenario]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      release_ready: ${{ steps.result.outputs.release_ready }}
      selected_ready: ${{ steps.result.outputs.selected_ready }}
      public_ready: ${{ steps.result.outputs.public_ready }}
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      PHASE: ${{ inputs.phase }}
      SCENARIO_RESULT: ${{ needs.scenario.result }}
      SELECTION_RESULT: ${{ needs.selection.result }}
      JOB_CASES: ${{ inputs.cases }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: Require every executor and recovery scenario to have succeeded
        run: test "$SELECTION_RESULT" = success && test "$SCENARIO_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: .cache/download
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: job-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.phase }}-*
          path: .cache/job-receipts
          merge-multiple: true
      - name: Require every scenario receipt for this phase, distribution and attempt
        id: result
        run: |
          mkdir -p .cache/candidate
          tar -xf .cache/download/candidate.tar -C .cache/candidate
          operation=gate
          case "$PROFILE" in
            full) ;;
            debug) operation=debug-gate ;;
            public-smoke) operation=public-smoke-gate ;;
            *) exit 1 ;;
          esac
          python3 tools/job_acceptance.py "$operation" --root .cache/candidate --sha "$CANDIDATE_SHA" --version "$VERSION" \
            --digest "$MANIFEST_SHA256" --phase "$PHASE" --profile "$PROFILE" --receipts .cache/job-receipts --cases "$JOB_CASES" \
            --summary .cache/job-summary/result.json
          printf 'selected_ready=true\n' >> "$GITHUB_OUTPUT"
          if [ "$operation" = gate ]; then
            printf 'release_ready=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'release_ready=false\n' >> "$GITHUB_OUTPUT"
          fi
          if [ "$operation" = public-smoke-gate ]; then
            printf 'public_ready=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'public_ready=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: job-summary-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.phase }}
          path: .cache/job-summary/result.json
          if-no-files-found: error
          retention-days: 7
