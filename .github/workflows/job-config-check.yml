name: Job configuration and authentication check
on:
  workflow_dispatch:
    inputs:
      expected_config_sha256:
        description: Expected canonical digest of the private GitLab lane configuration
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aliyun-pre-release-acceptance
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: aliyun-pre-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify private configuration and both Runner credentials without cloud access
        env:
          RELEASE_CLOUD_ACCEPTANCE_ENABLED: ${{ vars.RELEASE_CLOUD_ACCEPTANCE_ENABLED }}
          RELEASE_JOB_ACCEPTANCE_ENABLED: ${{ vars.RELEASE_JOB_ACCEPTANCE_ENABLED }}
          RELEASE_CLOUD_CLEANUP_ENABLED: ${{ vars.RELEASE_CLOUD_CLEANUP_ENABLED }}
          RELEASE_GITLAB_CONFIG: ${{ secrets.RELEASE_GITLAB_CONFIG }}
          RELEASE_GITLAB_API_TOKEN: ${{ secrets.RELEASE_GITLAB_API_TOKEN }}
          RELEASE_GITLAB_RUNNER_TOKEN: ${{ secrets.RELEASE_GITLAB_RUNNER_TOKEN }}
          RELEASE_GITLAB_DOCKER_RUNNER_TOKEN: ${{ secrets.RELEASE_GITLAB_DOCKER_RUNNER_TOKEN }}
          EXPECTED_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
        run: python3 tools/job_lane_check.py --expected-config-sha256 "$EXPECTED_CONFIG_SHA256"
