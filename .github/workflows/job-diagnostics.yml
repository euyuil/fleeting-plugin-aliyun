name: Read-only job diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate source SHA
        required: true
        type: string
      executor:
        required: true
        type: choice
        options: [instance, docker-autoscaler]
      scenario:
        required: true
        type: choice
        options: [smoke, failure, cancel, timeout, capacity, drain, worker-loss, manager-crash, upgrade]
      started_at:
        description: UTC start of the GitHub scenario job (ISO 8601 ending in Z)
        required: true
        type: string
      completed_at:
        description: UTC completion of the GitHub scenario job (ISO 8601 ending in Z)
        required: true
        type: string
      source_run_id:
        description: Source GitHub run ID for two-lane runs; omit for historical serial runs
        required: false
        type: string
      source_run_attempt:
        description: Source attempt, required together with source_run_id
        required: false
        type: string
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: aliyun-pre-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the selected GitLab job without raw log output
        env:
          RELEASE_GITLAB_CONFIG: ${{ secrets.RELEASE_GITLAB_CONFIG }}
          RELEASE_GITLAB_API_TOKEN: ${{ secrets.RELEASE_GITLAB_API_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXECUTOR: ${{ inputs.executor }}
          SCENARIO: ${{ inputs.scenario }}
          STARTED_AT: ${{ inputs.started_at }}
          COMPLETED_AT: ${{ inputs.completed_at }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          scope=()
          if [ -n "$SOURCE_RUN_ID$SOURCE_RUN_ATTEMPT" ]; then
            scope=(--run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_RUN_ATTEMPT")
          fi
          python3 tools/job_diagnostics.py --sha "$CANDIDATE_SHA" \
            --executor "$EXECUTOR" --scenario "$SCENARIO" \
            --started-at "$STARTED_AT" --completed-at "$COMPLETED_AT" "${scope[@]}"
