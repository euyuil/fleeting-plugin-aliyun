name: Network connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aliyun-network-connectivity
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Record this runner's public egress
        run: python3 tools/network-probe.py egress --output .network/egress.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-egress
          path: .network/egress.json
          retention-days: 1
      - name: Probe public APIs and pinned SSH server
        env:
          NETWORK_PROBE_ENDPOINTS: ${{ vars.ALIYUN_NETWORK_PROBE_ENDPOINTS }}
          NETWORK_PROBE_HOST: ${{ secrets.ALIYUN_NETWORK_PROBE_HOST }}
          NETWORK_PROBE_HOST_KEY_SHA256: ${{ secrets.ALIYUN_NETWORK_PROBE_HOST_KEY_SHA256 }}
        run: python3 tools/network-probe.py probe --output .network/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: network-result
          path: .network/result.json
          retention-days: 1
