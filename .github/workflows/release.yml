name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable version without v, for example 0.1.0
        required: true
        type: string
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Validate version and refuse existing releases
        run: python3 tools/release-preflight.py
  acceptance:
    needs: preflight
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cloud-acceptance.yml
    secrets:
      RELEASE_ALIYUN_ACCOUNT_ID: ${{ secrets.RELEASE_ALIYUN_ACCOUNT_ID }}
      RELEASE_ALIYUN_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_ROLE_ARN }}
      RELEASE_ALIYUN_CLEANUP_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_CLEANUP_ROLE_ARN }}
      RELEASE_ALIYUN_OIDC_PROVIDER_ARN: ${{ secrets.RELEASE_ALIYUN_OIDC_PROVIDER_ARN }}
      RELEASE_ALIYUN_FIXTURE_CONFIG: ${{ secrets.RELEASE_ALIYUN_FIXTURE_CONFIG }}
      RELEASE_ALIYUN_CLEANUP_REGIONS: ${{ secrets.RELEASE_ALIYUN_CLEANUP_REGIONS }}
      RELEASE_ALIYUN_JOB_FIXTURE_CONFIG: ${{ secrets.RELEASE_ALIYUN_JOB_FIXTURE_CONFIG }}
      RELEASE_GITLAB_CONFIG: ${{ secrets.RELEASE_GITLAB_CONFIG }}
      RELEASE_GITLAB_API_TOKEN: ${{ secrets.RELEASE_GITLAB_API_TOKEN }}
      RELEASE_GITLAB_RUNNER_TOKEN: ${{ secrets.RELEASE_GITLAB_RUNNER_TOKEN }}
    with:
      version: ${{ inputs.version }}
      candidate_sha: ${{ github.sha }}
  publish:
    needs: acceptance
    if: needs.acceptance.outputs.release_ready == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ needs.acceptance.outputs.candidate_sha }}
      MANIFEST_SHA256: ${{ needs.acceptance.outputs.manifest_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.acceptance.outputs.candidate_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.acceptance.outputs.artifact_id }}
          path: .cache/download
          merge-multiple: true
      - name: Verify and reuse the accepted publication payload
        run: |
          mkdir -p .cache/candidate
          tar -xf .cache/download/candidate.tar -C .cache/candidate
          python3 tools/release_candidate.py verify --root .cache/candidate --sha "$CANDIDATE_SHA" --version "$VERSION" --digest "$MANIFEST_SHA256"
          python3 tools/release-preflight.py
          cp -a .cache/candidate/dist dist
      - name: Create the exact source tag
        run: |
          git tag "v$VERSION" "$CANDIDATE_SHA"
          git push origin "refs/tags/v$VERSION"
      - name: Authenticate GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish Fleeting OCI packages
        run: go run ./tools/distribution -ref "ghcr.io/$GITHUB_REPOSITORY:$VERSION" -dir dist/packages
      - name: Create GitHub Release
        run: |
          flags=(--verify-tag --title "v$VERSION" --notes-file docs/release-notes.md)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "v$VERSION" dist/*.tar.gz dist/*.deb dist/SHA256SUMS dist/dependencies.json "${flags[@]}"
  verify:
    needs: [acceptance, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ inputs.version }}
      expected_revision: ${{ needs.acceptance.outputs.candidate_sha }}
  public_jobs:
    needs: [acceptance, publish, verify]
    concurrency:
      group: aliyun-pre-release-acceptance
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/job-acceptance.yml
    secrets:
      RELEASE_ALIYUN_ACCOUNT_ID: ${{ secrets.RELEASE_ALIYUN_ACCOUNT_ID }}
      RELEASE_ALIYUN_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_ROLE_ARN }}
      RELEASE_ALIYUN_CLEANUP_ROLE_ARN: ${{ secrets.RELEASE_ALIYUN_CLEANUP_ROLE_ARN }}
      RELEASE_ALIYUN_OIDC_PROVIDER_ARN: ${{ secrets.RELEASE_ALIYUN_OIDC_PROVIDER_ARN }}
      RELEASE_ALIYUN_CLEANUP_REGIONS: ${{ secrets.RELEASE_ALIYUN_CLEANUP_REGIONS }}
      RELEASE_ALIYUN_JOB_FIXTURE_CONFIG: ${{ secrets.RELEASE_ALIYUN_JOB_FIXTURE_CONFIG }}
      RELEASE_GITLAB_CONFIG: ${{ secrets.RELEASE_GITLAB_CONFIG }}
      RELEASE_GITLAB_API_TOKEN: ${{ secrets.RELEASE_GITLAB_API_TOKEN }}
      RELEASE_GITLAB_RUNNER_TOKEN: ${{ secrets.RELEASE_GITLAB_RUNNER_TOKEN }}
    with:
      artifact_id: ${{ needs.acceptance.outputs.artifact_id }}
      manifest_sha256: ${{ needs.acceptance.outputs.manifest_sha256 }}
      candidate_sha: ${{ needs.acceptance.outputs.candidate_sha }}
      version: ${{ inputs.version }}
      phase: public
