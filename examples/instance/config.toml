concurrent = 1

[[runners]]
  name = "aliyun-worker"
  url = "https://gitlab.com"
  token = "REPLACE_WITH_PROJECT_RUNNER_AUTH_TOKEN"
  executor = "instance"
  shell = "sh"
  [runners.feature_flags]
    FF_POSIXLY_CORRECT_ESCAPES = true
  [runners.autoscaler]
    plugin = "ghcr.io/euyuil/fleeting-plugin-aliyun:0.1.0-rc.2"
    capacity_per_instance = 1
    max_use_count = 1
    max_instances = 1
    instance_acquire_timeout = "10m"
    instance_ready_command = "timeout 300 sh -c 'until test -f /var/lib/fleeting-worker/ready; do sleep 2; done; git --version && gitlab-runner --version'"
    delete_instances_on_shutdown = true
    [runners.autoscaler.plugin_config]
      region = "cn-hangzhou"
      scaling_group_id = "REPLACE_WITH_DEDICATED_GROUP_ID"
    [runners.autoscaler.connector_config]
      protocol = "ssh"
      username = "ci"
      key_path = "/run/secrets/worker-key"
      use_static_credentials = true
      use_external_addr = true
    [[runners.autoscaler.policy]]
      idle_count = 0
      idle_time = "1m"
      preemptive_mode = false
