workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $FLEETING_NONCE =~ /^[0-9a-f]{48}$/ && $FLEETING_EXPECTED_RUNNER_ID =~ /^[0-9]+$/ && $FLEETING_EXECUTION_MODE =~ /^(instance|docker-autoscaler)$/'
    - when: never

.spot-common:
  tags:
    - $FLEETING_RUNNER_TAG
  retry: 0
  script:
    - test "$CI_RUNNER_ID" = "$FLEETING_EXPECTED_RUNNER_ID"
    - sh smoke.sh
  artifacts:
    paths: [result.json]
    expire_in: 1 day

spot-smoke:
  extends: .spot-common
  timeout: 20m
  rules:
    - if: '$FLEETING_JOB_SCENARIO =~ /^(capacity|drain|worker-loss|manager-crash)$/'
      when: never
    - if: '$FLEETING_JOB_SCENARIO == "timeout"'
      variables:
        RUNNER_SCRIPT_TIMEOUT: 3m
    - when: on_success

spot-controlled:
  extends: .spot-common
  timeout: 40m
  rules:
    - if: '$FLEETING_JOB_SCENARIO =~ /^(capacity|drain|worker-loss)$/'

spot-manager-crash:
  extends: .spot-common
  timeout: 15m
  rules:
    - if: '$FLEETING_JOB_SCENARIO == "manager-crash"'
